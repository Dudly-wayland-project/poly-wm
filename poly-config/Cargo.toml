[package]
name = "poly-config"
description = "JavaScript configuration types and loader for the Poly compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bitflags = "2"
# QuickJS bindings; the crate ships the C sources, so no system QuickJS and no
# bindgen are needed.
rquickjs = { version = "0.14", features = ["std"] }
poly-ipc = { path = "../poly-ipc" }
thiserror.workspace = true
tracing.workspace = true
# Same version as smithay's, so `xkbcommon::xkb::Keysym` is one and the same
# type across the workspace.
xkbcommon = { version = "0.9", default-features = false }
